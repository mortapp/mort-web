name: Production onboarding validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/app/actions.ts"
      - "app/app/onboarding/**"
      - "app/auth/callback/**"
      - "components/onboarding-form.tsx"
      - "lib/auth.ts"
      - "scripts/onboarding-v2-contract.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/onboarding-validation.yml"

permissions:
  contents: read

concurrency:
  group: onboarding-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:production-config
      - run: npm run typecheck
      - run: npx eslint app/app/actions.ts app/app/onboarding/page.tsx app/app/page.tsx app/app/teen/actions.ts app/app/teen/layout.tsx app/app/adult/layout.tsx app/app/guardian/layout.tsx app/app/admin/layout.tsx app/auth/callback/route.ts components/onboarding-form.tsx lib/auth.ts
      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jxbnrkasktbhtiujkhay.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_placeholder
          NEXT_PUBLIC_SITE_URL: https://mortapp.org

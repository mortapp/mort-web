name: MORT website production-integration validation

on:
  push:
    branches: [assistant/website-production-integration]
    paths:
      - "app/app/**"
      - "app/auth/**"
      - "components/**"
      - "lib/**"
      - "content/legal-*.json"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/onboarding-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/app/**"
      - "app/auth/**"
      - "components/**"
      - "lib/**"
      - "content/legal-*.json"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/onboarding-validation.yml"

permissions:
  contents: read

concurrency:
  group: mort-web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:production-config
      - run: npm run typecheck
      - run: npm run lint
      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jxbnrkasktbhtiujkhay.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_placeholder
          NEXT_PUBLIC_SITE_URL: https://mortapp.org
